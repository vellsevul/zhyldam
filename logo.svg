<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx=".55" cy=".45" r=".7">
      <stop offset="0" stop-color="#2a0f4d"/><stop offset=".55" stop-color="#12071f"/><stop offset="1" stop-color="#050307"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="main" d="M312 40 L296 84 L306 102 L284 128 L318 150 L270 214 L284 226 L262 244 L296 262 L238 334 L258 350 L222 420 L236 438 L206 478"/>
    <path id="br" d="M318 150 L356 172 L350 196 L392 232 M350 196 L326 220 M270 214 L222 234 L210 276 L180 302 M222 234 L172 230 M296 262 L338 300 L332 336 L352 372 M258 350 L232 392"/>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#sky)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- свечение -->
    <use href="#main" stroke="#a855f7" stroke-width="64" filter="url(#glow)"/>
    <use href="#br" stroke="#9333ea" stroke-width="30" filter="url(#glow)" opacity=".85"/>
    <!-- яркий фиолетовый контур -->
    <use href="#br" stroke="#b061ff" stroke-width="15"/>
    <use href="#main" stroke="#b061ff" stroke-width="38"/>
    <!-- сиреневый переход -->
    <use href="#br" stroke="#e2c6ff" stroke-width="8" filter="url(#soft)"/>
    <use href="#main" stroke="#e2c6ff" stroke-width="24" filter="url(#soft)"/>
    <!-- бело-сиреневая сердцевина -->
    <use href="#br" stroke="#fdf9ff" stroke-width="4"/>
    <use href="#main" stroke="#fdf9ff" stroke-width="12"/>
  </g>
</svg>
