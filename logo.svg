<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#2e1057"/><stop offset=".6" stop-color="#140823"/><stop offset="1" stop-color="#060309"/>
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f5ebff"/><stop offset="1" stop-color="#dcbcff"/>
    </linearGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="neon2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <!-- пухлая мультяшная молния -->
    <path id="b" d="M300 58 L168 280 L252 280 L210 454 L352 222 L268 222 L318 58 Z"/>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#sky)"/>
  <!-- неоновое свечение трубки -->
  <use href="#b" fill="none" stroke="#a855f7" stroke-width="64" stroke-linejoin="round" filter="url(#neon)" opacity=".95"/>
  <use href="#b" fill="none" stroke="#c084fc" stroke-width="40" stroke-linejoin="round" filter="url(#neon2)"/>
  <!-- толстый яркий контур -->
  <use href="#b" fill="#b061ff" stroke="#b061ff" stroke-width="34" stroke-linejoin="round"/>
  <!-- белый неоновый кант -->
  <use href="#b" fill="none" stroke="#f3e8ff" stroke-width="14" stroke-linejoin="round" opacity=".9"/>
  <!-- заливка -->
  <use href="#b" fill="url(#fill)" stroke="url(#fill)" stroke-width="4" stroke-linejoin="round"/>
  <!-- мультяшный блик -->
  <path d="M292 92 L214 226" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity=".95"/>
  <circle cx="302" cy="76" r="7" fill="#fff"/>
</svg>
